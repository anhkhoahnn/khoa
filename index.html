<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link nhanh</title>
<style>
  :root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mut:#6e6e73;--ac:#0071e3}
  @media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mut:#98989d;--ac:#2997ff}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:20px}
  .card{width:100%;max-width:420px;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 16px}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--mut);background:transparent;color:var(--tx);font-size:16px}
  .url{margin:16px 0;padding:14px;border-radius:12px;background:var(--bg);word-break:break-all;font-size:15px;color:var(--mut);min-height:48px}
  .btn{display:block;width:100%;padding:16px;margin-top:10px;border:0;border-radius:14px;font-size:17px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
  .primary{background:var(--ac);color:#fff}
  .second{background:var(--bg);color:var(--ac)}
  .msg{text-align:center;margin-top:12px;font-size:14px;color:var(--mut);min-height:20px}
</style>
</head>
<body>
<div class="card">
  <h1 id="ttl">🔗 Link của bạn</h1>
  <input id="inp" type="url" inputmode="url" placeholder="Dán link vào đây (https://...)" autocomplete="off">
  <div class="url" id="show">Chưa có link</div>
  <button class="btn primary" id="copy">📋 Copy link</button>
  <a class="btn second" id="open" href="#" target="_blank" rel="noopener">🌐 Mở link</a>
  <a class="btn second" id="safari" href="#">🧭 Mở bằng Safari</a>
  <div class="msg" id="msg"></div>
</div>
<script>
  // Đổi link mặc định ở đây:
  // Danh sách theo user: thêm dòng  tên: "link"
  // Mở web bằng:  .../index.html?u=tên   (ví dụ ?u=an)
  var USERS = {
  var USERS = {
  sang:   "https://link-cua-an.com",
  long: "https://link-cua-binh.com",
  tung: "https://link-cua-khoa.com"
};
  };
  var DEFAULT_LINK = "";
  var qs=new URLSearchParams(location.search), UID=(qs.get('u')||location.hash.slice(1)||'').toLowerCase();
  if(UID&&USERS[UID])DEFAULT_LINK=USERS[UID];
  var inp=document.getElementById('inp'),show=document.getElementById('show'),
      openA=document.getElementById('open'),saf=document.getElementById('safari'),msg=document.getElementById('msg');
  var link=DEFAULT_LINK;
  if(!(UID&&USERS[UID])){try{link=localStorage.getItem('link')||link}catch(e){}}
  function norm(u){u=(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u}
  function render(){
    link=norm(link);inp.value=link;
    show.textContent=link||'Chưa có link';
    openA.href=link||'#';
    saf.href=link?link.replace(/^https:/i,'x-safari-https:').replace(/^http:/i,'x-safari-http:'):'#';
    try{localStorage.setItem('link',link)}catch(e){}
  }
  inp.addEventListener('input',function(){link=inp.value;show.textContent=norm(link)||'Chưa có link';
    openA.href=norm(link)||'#';var n=norm(link);
    saf.href=n?n.replace(/^https:/i,'x-safari-https:').replace(/^http:/i,'x-safari-http:'):'#';
    try{localStorage.setItem('link',n)}catch(e){}});
  document.getElementById('copy').addEventListener('click',async function(){
    var t=norm(link);if(!t){msg.textContent='Hãy dán link trước';return}
    try{await navigator.clipboard.writeText(t);msg.textContent='✅ Đã copy!'}
    catch(e){inp.value=t;inp.focus();inp.select();inp.setSelectionRange(0,99999);
      try{document.execCommand('copy');msg.textContent='✅ Đã copy!'}catch(_){msg.textContent='Giữ vào ô link rồi chọn Copy'}}
  });
  if(UID&&USERS[UID])document.getElementById('ttl').textContent='🔗 Link của '+UID;
  render();
</script>
</body>
</html>
